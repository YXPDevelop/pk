  function resize(){const mW=Math.min(window.innerWidth-12,720),mH=Math.min(window.innerHeight-12,405);scale=Math.min(mW/W,mH/H);c.width=Math.floor(W*scale);c.height=Math.floor(H*scale);c.style.width=c.width+'px';c.style.height=c.height+'px';groundY=Math.floor(H*0.82);}

  }
  function die(){gameOver=!0;deathAlpha=0;pVY=-280;pGrounded=!1;addFloating(pX,pY-25,['掉下车了！','饿↑↑↓','你干嘛~哎哟','鸡你太美','芭比Q了','栓Q'][Math.floor(Math.random()*6)],'#ff4444');}
  function jump(){if(paused)return;const now=performance.now()/1000;if(now-lastJump<JCd)return;if(gState==='start'){gState='story';sIdx=0;sTimer=0;lastJump=now;return;}if(gState==='story'){gState='playing';init();lastJump=now;return;}if(gameOver){init();gState='playing';lastJump=now;return;}if(!started){init();gState='playing';lastJump=now;return;}if(jumps>0||infJump){pVY=sJump?-680:JV;pGrounded=!1;if(!infJump)jumps--;lastJump=now;}}
  function wrapText(text,maxW,fs){ctx.font=fs+"px Courier New",monospace;const lines=[];let cur='';for(let ch of text){if(ch==='\n'){lines.push(cur);cur='';continue;}let test=cur+ch;if(ctx.measureText(test).width>maxW&&cur.length>0){lines.push(cur);cur=ch;}else cur=test;}if(cur)lines.push(cur);return lines;}
  function cSet(){const p=document.getElementById('console-param').value,v=parseFloat(document.getElementById('console-value').value);if(isNaN(v))return;switch(p){case'x':pX=Math.max(DX,Math.min(W-PS/2,v));mX=!0;setTimeout(()=>{mX=!1;},100);break;case'y':pY=Math.max(PS/2,Math.min(groundY-PS/2,v));mY=!0;setTimeout(()=>{mY=!1;},100);break;case'speed':gameSpeed=Math.max(20,Math.min(550,v));mSp=!0;setTimeout(()=>{mSp=!1;},100);break;case'coin':gold=Math.max(0,Math.min(999,Math.floor(v)));mCoin=!0;setTimeout(()=>{mCoin=!1;},100);break;}}
  function toggleCh(id,state){const b=document.getElementById(id);if(state)b.classList.add('active');else b.classList.remove('active');}
  function showPanel(){panel.classList.add('show');toggleCh('btn-god',god);toggleCh('btn-superjump',sJump);toggleCh('btn-slowmo',slow);toggleCh('btn-infjump',infJump);toggleCh('btn-kun',kun);toggleCh('btn-auto',auto);}
  function hidePanel(){panel.classList.remove('show');}
  function swipeEnd(){if(swipe.length>=4&&swipe.slice(-4).join(',')==='up,up,down,down'){if(panel.classList.contains('show'))hidePanel();else showPanel();swipe=[];}}
  function openFB(){paused=!0;fOverlay.classList.add('show');document.getElementById('feedback-text').value='';document.getElementById('feedback-msg').style.display='none';}
  function closeFB(){paused=!1;fOverlay.classList.remove('show');}
  function drawEmoji(text,x,y,size){const e=String.fromCodePoint||function(c){if(c<0x10000)return String.fromCharCode(c);return String.fromCharCode(0xD800+((c-0x10000)>>10),0xDC00+((c-0x10000)&0x3FF));};ctx.font=Math.floor(size)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y);}
  function drawNum(num,cx,cy,unit=4,color='#ffffff'){const s=Math.floor(num).toString(),tw=s.length*(5*unit+2)-2;let sx=cx-tw/2;for(let ch of s){const p=dig[ch];if(!p){sx+=5*unit+2;continue;}for(let r=0;r<7;r++)for(let co=0;co<5;co++)if(p[r][co]){ctx.fillStyle=color;ctx.fillRect(sx+co*unit,cy-3*unit+r*unit,unit,unit);}sx+=5*unit+2;}}
  function drawBorder(x,y,w,h,color='#ffffff',t=3){ctx.fillStyle=color;for(let i=0;i<t;i++){ctx.fillRect(x+i,y+i,w-2*i,1);ctx.fillRect(x+i,y+h-1-i,w-2*i,1);ctx.fillRect(x+i,y+i,1,h-2*i);ctx.fillRect(x+w-1-i,y+i,1,h-2*i);}}
  function render(){
    ctx.clearRect(0,0,W,H);
    if(gState==='start'){for(let i=0;i<groundY;i+=10)ctx.fillStyle=i%20===0?'#4a2020':'#3a1818',ctx.fillRect(0,i,W,10);const g=ctx.createLinearGradient(0,groundY,0,H);g.addColorStop(0,'#ff4500');g.addColorStop(1,'#cc3300');ctx.fillStyle=g;ctx.fillRect(0,groundY,W,H-groundY);ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 20px "Courier New",monospace';ctx.textAlign='center';ctx.fillText('看到我的入是gay',W/2,H/2-20);ctx.font='bold 14px "Courier New",monospace';ctx.fillText('点击任意处开始游戏',W/2,H/2+20);return;}
    if(gState==='story'){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const dText=txt.substring(0,sIdx),lines=wrapText(dText,W-30,12),maxL=Math.floor((H-80)/LH);let off=0;if(lines.length>maxL)off=(lines.length-maxL)*LH;ctx.save();ctx.translate(0,40-off);ctx.fillStyle='#fff';ctx.font='12px "Courier New",monospace';ctx.textAlign='left';for(let i=0;i<lines.length;i++){if(i*LH+40>H-30)break;ctx.fillText(lines[i],15,i*LH);}ctx.restore();ctx.fillStyle='#aaa';ctx.font='11px "Courier New",monospace';ctx.textAlign='center';ctx.fillText('点击跳过',W/2,H-15);return;}
    let sc;if(curMap===0)sc=['#a0c0e0','#8098c0'];else if(curMap===1)sc=['#e0c080','#c0a060'];else if(curMap===2)sc=['#0a0a2e','#000020'];else sc=['#1a4a1a','#0a2a0a'];
    for(let i=0;i<groundY;i+=10)ctx.fillStyle=i%20===0?sc[0]:sc[1],ctx.fillRect(0,i,W,10);
    if(curMap===2){for(let cl of clouds)drawEmoji(cl.emoji||'⭐',cl.x,cl.y,cl.size);}else if(curMap===3){for(let b of buildings)drawEmoji('🌳',b.x,b.y,b.size);for(let cl of clouds)drawEmoji('☁️',cl.x,cl.y,cl.size);}else{for(let b of buildings)ctx.fillStyle='#2a1a1a',ctx.fillRect(b.x-b.size/2,b.y,b.size,groundY-b.y),drawEmoji('🏢',b.x,b.y,b.size*0.7);for(let cl of clouds)drawEmoji('☁️',cl.x,cl.y,cl.size);}
    if(curMap===0){ctx.fillStyle='#e8f0ff';ctx.fillRect(0,groundY,W,H-groundY);for(let i=0;i<W;i+=10)ctx.fillStyle='#fff',ctx.fillRect(i,groundY+2,7,3);}else if(curMap===1){ctx.fillStyle='#e8d0a0';ctx.fillRect(0,groundY,W,H-groundY);for(let i=0;i<W;i+=12)ctx.fillStyle='#c0a060',ctx.fillRect(i,groundY+2,8,3);}else if(curMap===2){ctx.fillStyle='#111';ctx.fillRect(0,groundY,W,H-groundY);for(let i=0;i<W;i+=20)ctx.fillStyle='#333',ctx.fillRect(i,groundY,15,3);}else{ctx.fillStyle='#2d5a27';ctx.fillRect(0,groundY,W,H-groundY);for(let i=0;i<W;i+=12)ctx.fillStyle='#1d3a17',ctx.fillRect(i,groundY+2,8,3);}
    for(let v of vehicles){ctx.save();ctx.translate(v.x,v.topY+v.h/2);ctx.scale(-1,1);ctx.fillStyle=v.tall?'#3498db':'#e74c3c';if(curMap===2)ctx.fillStyle=v.tall?'#6a4fff':'#4a2faa';else if(curMap===3)ctx.fillStyle=v.tall?'#6b8e23':'#556b2f';ctx.fillRect(-v.w/2,-v.h/2,v.w,v.h);ctx.fillStyle=v.tall?'#2980b9':'#c0392b';ctx.fillRect(-v.w/2+4,-v.h/2+2,v.w-8,v.h-4);drawEmoji(v.emoji,0,0,Math.min(v.w*0.65,v.h*0.85));ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-v.w/3,v.h/2-7,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(v.w/3,v.h/2-7,8,0,Math.PI*2);ctx.fill();ctx.restore();if(v.tall){const sx=v.x-v.w/2-15,sy=groundY,ex=v.x-v.w/2+8,ey=v.topY;ctx.strokeStyle='#8B4513';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();for(let r=0;r<5;r++){const t=r/4,rx=sx+(ex-sx)*t,ry=sy+(ey-sy)*t;ctx.fillStyle='#A0522D';ctx.fillRect(rx-2,ry-2,10,3);}drawEmoji('🪜',ex,ey-8,16);}}
    for(let o of obstacles)drawEmoji(o.emoji,o.x,o.y,o.size);for(let c of coins){const sh=Math.sin(frame*0.15+c.x*0.1)*2;drawEmoji('🪙',c.x,c.y+sh,CS);}for(let ft of texts){const a=Math.max(0,1-ft.age/ft.life);ctx.save();ctx.globalAlpha=a;ctx.fillStyle=ft.color;ctx.font='bold 13px "Courier New",monospace';ctx.textAlign='center';ctx.fillText(ft.text,ft.x,ft.y);ctx.restore();}
    const bob=pGrounded?Math.sin(frame*0.1)*1.5:0;ctx.save();ctx.translate(pX,pY+bob);ctx.scale(-1,1);drawEmoji(penguin(),0,0,PS);if(shield){ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,PS/1.4,0,Math.PI*2);ctx.stroke();}ctx.restore();
    const sY=30;ctx.fillStyle='#0a0a1a';ctx.fillRect(W/2-60,sY-15,120,36);drawBorder(W/2-60,sY-15,120,36,'#f0e68c',2);drawEmoji('⭐',W/2-42,sY,16);drawNum(score,W/2-4,sY+2,3,'#ffd966');drawEmoji('🪙',W/2+32,sY,14);ctx.fillStyle='#ffd700';ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='center';ctx.fillText(gold,W/2+50,sY+1);ctx.textAlign='start';
    if(god){ctx.fillStyle='#fff';ctx.font='bold 9px "Courier New",monospace';ctx.fillText('🛡️无敌',W-48,sY+4);}if(auto){ctx.fillStyle='#00ff88';ctx.font='bold 9px "Courier New",monospace';ctx.fillText('🤖自动',W-48,sY+16);}
    if(gameOver&&deathAlpha>0){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const mx=W/2,my=H/2-8;ctx.fillStyle='#1a1a2e';ctx.fillRect(mx-130,my-100,260,210);drawBorder(mx-130,my-100,260,210,'#fff',3);drawEmoji('💀',mx,my-55,40);ctx.fillStyle='#fff';ctx.font='bold 18px "Courier New",monospace';ctx.textAlign='center';ctx.fillText('GAME OVER',mx,my-18);drawEmoji('🏆',mx-45,my+12,22);drawNum(score,mx+8,my+16,4,'#ffd700');const bX=mx-60,bY=my+52,bW=120,bH=38;ctx.fillStyle='#2a2a4a';ctx.fillRect(bX,bY,bW,bH);drawBorder(bX,bY,bW,bH,'#fff',2);drawEmoji('🔄',bX+28,bY+bH/2,22);ctx.fillStyle='#fff';ctx.font='bold 15px "Courier New",monospace';ctx.fillText('RESTART',bX+60,bY+bH/2+1);}
  }
  function gameLoop(ts){if(!lastT)lastT=ts;let dt=(ts-lastT)/1000;if(dt>0.1)dt=0.1;lastT=ts;update(dt);ctx.save();ctx.setTransform(scale,0,0,scale,0,0);render();ctx.restore();requestAnimationFrame(gameLoop);}
  c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];touchSX=t.clientX;touchSY=t.clientY;},{passive:!1});
  c.addEventListener('touchend',e=>{e.preventDefault();if(!touchSX||!touchSY)return;const t=e.changedTouches[0],dx=t.clientX-touchSX,dy=t.clientY-touchSY;if(Math.abs(dx)<20&&Math.abs(dy)<20)jump();else if(Math.abs(dy)>28&&Math.abs(dy)>Math.abs(dx)){swipe.push(dy<0?'up':'down');if(swipe.length>10)swipe=swipe.slice(-10);swipeEnd();}touchSX=0;touchSY=0;});
  c.addEventListener('mousedown',e=>{e.preventDefault();jump();});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp'){e.preventDefault();jump();}});window.addEventListener('resize',resize);
  document.getElementById('btn-god').addEventListener('click',()=>{god=!god;toggleCh('btn-god',god);});document.getElementById('btn-superjump').addEventListener('click',()=>{sJump=!sJump;toggleCh('btn-superjump',sJump);});document.getElementById('btn-slowmo').addEventListener('click',()=>{slow=!slow;toggleCh('btn-slowmo',slow);if(!slow&&started&&!gameOver&&!mSp)gameSpeed=180+score*0.55;});document.getElementById('btn-infjump').addEventListener('click',()=>{infJump=!infJump;toggleCh('btn-infjump',infJump);if(infJump)jumps=999;else jumps=pGrounded?2:jumps;});document.getElementById('btn-kun').addEventListener('click',()=>{kun=!kun;toggleCh('btn-kun',kun);});document.getElementById('btn-auto').addEventListener('click',()=>{auto=!auto;toggleCh('btn-auto',auto);autoJumpCd=0;autoTimer=0;});document.getElementById('btn-nextmap').addEventListener('click',switchMap);document.getElementById('console-set').addEventListener('click',cSet);document.getElementById('cheat-close').addEventListener('click',hidePanel);document.getElementById('feedback-btn').addEventListener('click',openFB);document.getElementById('feedback-cancel').addEventListener('click',closeFB);document.getElementById('feedback-send').addEventListener('click',()=>{document.getElementById('feedback-msg').style.display='block';setTimeout(()=>{closeFB();},1500);});
  document.getElementById('slider-x').addEventListener('input',function(){pX=parseInt(this.value);document.getElementById('val-x').textContent=this.value;mX=!0;});document.getElementById('slider-y').addEventListener('input',function(){pY=parseInt(this.value);document.getElementById('val-y').textContent=this.value;mY=!0;});document.getElementById('slider-speed').addEventListener('input',function(){gameSpeed=parseInt(this.value);document.getElementById('val-speed').textContent=this.value;mSp=!0;});document.getElementById('slider-coin').addEventListener('input',function(){gold=parseInt(this.value);document.getElementById('val-coin').textContent=this.value;mCoin=!0;});
  resize();groundY=Math.floor(H*0.82);let lastT=performance.now();requestAnimationFrame(gameLoop);
})();
